  @page { size: 210mm 297mm; margin: 0; }

  .banda { position: absolute; inset: 0 0 auto 0; height: 168mm; background: #111111; overflow: hidden; }

  .textos { position: absolute; left: 0; right: 0; top: 190mm; text-align: center; }
  .modulo { font-family: 'Bahnschrift', 'Impact', sans-serif; font-stretch: condensed; font-weight: 600; letter-spacing: 3pt;

  .linea { width: 60mm; height: 1.4mm; background: #111111; margin: 6mm auto 0; }
  .pie { position: absolute; left: 18mm; right: 18mm; bottom: 16mm; display: flex; justify-content: space-between;

  .pie b { font-family: 'Bahnschrift', 'Impact', sans-serif; font-stretch: condensed; font-size: 12pt; letter-spacing: 1pt; text-transform: uppercase; }
  .pie .der { text-align: right; color: #6B6B6B; }
